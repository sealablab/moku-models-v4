
platform: moku_go

slots:
  1:
    instrument: Oscilloscope
    settings:
      sample_rate: 125e6  # 125 MSa/s (native Moku:Go rate)

  2:
    instrument: CloudCompile
    bitstream: ./temp_bits.tar
    control_registers:
      # CR0: Main control register
      # [31]: ready flag
      # [30]: user enable
      # [29]: clock enable
      0: 0x00000000

      # CR1: Lifecycle control
      # [0]: arm enable
      # [1]: external trigger input
      # [2]: auto rearm enable
      # [3]: fault clear
      1: 0x00000000

      # CR2: Output A voltage (mV)
      2: 3300

      # CR3: Output A duration (ns)
      3: 100

      # CR4: Output B voltage (mV)
      4: 0

      # CR5: Output B duration (ns)
      5: 200

      # CR6: Timeout value (seconds)
      6: 2

      # CR7: Cooldown interval (microseconds)
      7: 10

      # CR8: Monitor control flags
      # [0]: monitor enable
      # [1]: monitor expect negative
      8: 0x00000003

      # CR9: Monitor threshold voltage (mV, signed)
      9: 0xFF38  # -200 mV

      # CR10: Monitor window start (ns)
      10: 0

      # CR11: Monitor window duration (ns)
      11: 5000

routing:
  # Physical input 1 to CloudCompile InputA
  - source: Input1
    destination: Slot2InA

  # Physical input 2 to CloudCompile InputB
  - source: Input2
    destination: Slot2InB

  # Physical input 2 also to Oscilloscope InputB (dual monitoring)
  - source: Input2
    destination: Slot1InB

  # CloudCompile OutputA to physical output 1
  - source: Slot2OutA
    destination: Output1

  # CloudCompile OutputB to physical output 2
  - source: Slot2OutB
    destination: Output2

  # CloudCompile OutputC to Oscilloscope InputA (monitoring)
  - source: Slot2OutC
    destination: Slot1InA

metadata:
  version: "1.0.0"
  created: "2025-11-11"
  notes: Reference configuration example for Moku:Go with CloudCompile custom instrument


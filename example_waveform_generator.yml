
# Example: Oscilloscope with Built-in Waveform Generator
# This demonstrates the optional waveform_output extension field

platform: moku_go

slots:
  1:
    instrument: Oscilloscope
    settings:
      sample_rate: 125e6

    # Optional: Configure Oscilloscope's built-in waveform generator
    waveform_output:
      channel: 1           # Output channel (1 or 2)
      enable: true
      waveform_type: Square  # 'Sine', 'Square', 'Triangle'
      frequency: 1000      # Hz
      amplitude: 2.5       # Volts
      offset: 1.25         # DC offset in volts
      duty: 50             # Duty cycle % (Square waves only)

routing: []

metadata:
  notes: Example showing optional waveform_output extension field
